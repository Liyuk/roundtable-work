body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Idea, alternatives, and expected outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How will we know the approach works?
