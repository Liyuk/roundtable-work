name: Agreed work item
description: Create an executable ticket for an idea that has been discussed.
title: "[Task] "
body:
  - type: input
    id: discussion
    attributes:
      label: Linked Discussion URL
      description: Please discuss features and general improvements first.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Goal, scope, and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, work boundaries, and other background
