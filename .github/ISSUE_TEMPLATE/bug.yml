name: Bug report
description: Report a reproducible problem directly; the fix PR should link to this Issue.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and impact
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps, expected and actual results
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version, environment, and relevant evidence (do not include sensitive information)
