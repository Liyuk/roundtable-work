name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is the arm64 image; its runner pool is capacity-constrained and jobs can
        # be cancelled before a runner is acquired. Pin the Intel image so the macOS check stays green.
        os: [ubuntu-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify macOS has no /proc
        if: runner.os == 'macOS'
        run: test ! -e /proc
      - run: npm test
