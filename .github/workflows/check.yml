name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
  issues: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify macOS has no /proc
        if: runner.os == 'macOS'
        run: test ! -e /proc
      - run: npm test
      # Every code path and issue named in docs/architecture.md must exist. Uses only the job's own read-only GITHUB_TOKEN.
      - name: Check architecture references
        run: npm run check:architecture-refs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The committed site/ must equal a fresh build of docs/architecture.md, and only the allowed files may be published.
      - run: npm run build:site -- --check
      - run: npm run validate:site
